<?xml version="1.0" encoding="UTF-8"?>
<!-- H.E.R ring device mark — original work authored for HER2NI LLC.
     Pure geometry: one circle, four layered strokes with Gaussian glow.
     Canonical vector for brand use and device-mark filing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048">
  <defs>
    <filter id="glowOuter" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>
    <filter id="glowMid" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="glowInner" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glowCore" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- transparent background; place over dark surfaces -->

  <!-- outer atmospheric halo -->
  <circle cx="1024" cy="1024" r="560" fill="none"
          stroke="#2E7FD0" stroke-width="46" opacity="0.55"
          filter="url(#glowOuter)"/>

  <!-- mid glow -->
  <circle cx="1024" cy="1024" r="560" fill="none"
          stroke="#5FB8F5" stroke-width="26" opacity="0.85"
          filter="url(#glowMid)"/>

  <!-- main neon stroke -->
  <circle cx="1024" cy="1024" r="560" fill="none"
          stroke="#8FD4FF" stroke-width="15"
          filter="url(#glowInner)"/>

  <!-- white-hot core -->
  <circle cx="1024" cy="1024" r="560" fill="none"
          stroke="#EAF8FF" stroke-width="6.5"
          filter="url(#glowCore)"/>
</svg>
