<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="44.13793 44.13793 551.72414 551.72414" role="img" aria-labelledby="title description">
  <title id="title">H.E.R Ring™</title>
  <desc id="description">The static H.E.R Ring™: one blue-white luminous circular boundary blooming around a dark centre.</desc>
  <defs>
    <filter id="wide-halo" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="32" />
    </filter>
    <filter id="medium-halo" x="-45%" y="-45%" width="190%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="17" />
    </filter>
    <filter id="near-halo" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="soft-halo" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <filter id="particle-glow" x="-300%" y="-300%" width="700%" height="700%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="particle-bloom" />
      <feMerge>
        <feMergeNode in="particle-bloom" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="particle-soft" x="-250%" y="-250%" width="600%" height="600%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="particle-soft-bloom" />
      <feMerge>
        <feMergeNode in="particle-soft-bloom" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

